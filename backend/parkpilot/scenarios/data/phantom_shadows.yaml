id: phantom_shadows
title: Shadows and puddles, plus one real pedestrian
complaints: [C8]
description: >
  Tree shadows and puddles along the aisle produce flickering false detections. A real
  pedestrian later steps out between parked cars. Without a persistence filter every
  flicker is a hard brake; ParkPilot ignores unconfirmed detections but still stops for
  the confirmed, approaching pedestrian (missed hazards must be zero).
