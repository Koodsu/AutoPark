id: dance_spot_opens
title: A spot opens up after the car has committed
complaints: [C1, C12]
description: >
  The car commits to a free stall. While it approaches, a parked car closer to the entrance
  backs out, opening a spot that is only slightly better. Systems without commitment hop to
  the new spot and re-plan mid-maneuver; ParkPilot yields to the backing car, keeps its
  commitment (the new spot is not clearly better) and parks with few gear changes.
