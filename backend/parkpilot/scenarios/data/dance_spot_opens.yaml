id: dance_spot_opens
title: A spot opens up after the car has committed
complaints: [C1, C12]
description: >
  A free stall is visible early; while the car looks for something closer to the door, a
  parked car near the entrance backs out into the aisle. ParkPilot yields to it and takes
  the opened stall if it has not yet committed (a commitment is only abandoned for a
  clearly better spot), parking with few gear changes. The baseline grabs the first stall
  it sees and keeps re-planning on a timer, shuffling back and forth.
