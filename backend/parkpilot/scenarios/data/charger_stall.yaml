id: charger_stall
title: Charger stalls with the post on one side
complaints: [C11]
description: >
  Four 3.2 m charger stalls, each with a charging pedestal on its right-hand stall line
  near the head.
  The ego's charge port is on the rear-left, so the car must reverse in to put the port next
  to the post, and pull in far enough that the cable reaches (owners report cars stopping
  "a foot short"). The driver has said they want to charge.
