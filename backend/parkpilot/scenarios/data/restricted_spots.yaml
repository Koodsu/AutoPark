id: restricted_spots
title: Restricted stalls and no-parking surfaces everywhere near the door
complaints: [C5]
description: >
  The first free stalls along the aisle, right by the entrance, are accessible,
  expectant-mother, EV-only, reserved and motorcycle stalls, and one open-looking stall is a
  hatched loading zone. The user has no placard, permit or charging need, so only standard
  stalls farther along (and across the aisle) are legal. A first-available system parks in
  the first of the restricted stalls.
