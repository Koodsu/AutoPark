id: home_garage
title: Home garage with the charger on one wall
complaints: [C10, C11]
description: >
  A single-car home garage, 3.4 m wide, with the wall charger on the right-hand wall at the
  back. The car must enter the garage without scraping the door frame (mirrors included),
  on the correct side for its rear-left charge port, which means reversing in from the
  forecourt.
